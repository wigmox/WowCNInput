name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      upload_url: ${{ steps.release.outputs.upload_url }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      # 只有当真正发布了 Release（即合并了发布 PR）时才运行打包
      - name: Package AddOn
        if: ${{ steps.release.outputs.release_created }}
        run: |
          # 定义插件在压缩包内的根目录名，游戏内看到的文件夹名
          ADDON_DIR_NAME="WowCNInput"
          # 定义输出的压缩包文件名
          OUTPUT_ZIP="../WowCNInput.zip"

          echo "Creating temporary directory structure..."
          # 创建干净的临时目录结构，用于存放待打包的文件
          mkdir -p "temp/${ADDON_DIR_NAME}"

          echo "Copying all files (excluding .git and .github) ..."
          # 使用 rsync 风格的方式复制所有文件，但排除不需要的目录
          # 方法：启用 dotglob 来包含隐藏文件，然后用 tar 管道到 tar 来复制，同时排除指定模式
          # 这是一个既包含所有文件（包括子目录）又排除特定目录的稳健方法
          shopt -s dotglob  # 开启后，* 会包含以 . 开头的文件（如 .toc），但也会包含 .git 等
          # 复制除 .git 和 .github 之外的所有内容到临时目录
          # 使用 tar 来复制目录结构是最可靠的，它能完美处理所有文件和符号链接
          tar cf - --exclude='.git' --exclude='.github' --exclude='temp' . | (cd "temp/${ADDON_DIR_NAME}" && tar xf -)
          shopt -u dotglob  # 恢复 dotglob 设置，好习惯

          echo "Contents of temp/${ADDON_DIR_NAME} (top level):"
          ls -la "temp/${ADDON_DIR_NAME}"

          echo "Creating zip archive..."
          # 进入 temp 目录，将插件文件夹打包
          cd temp
          zip -r "${OUTPUT_ZIP}" "${ADDON_DIR_NAME}/"
          cd ..

          echo "Zip file created successfully. Listing root directory:"
          ls -l *.zip

      - name: Upload Release Asset
        if: ${{ steps.release.outputs.release_created }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}   # 显式指定标签
          files: |
            ./WowCNInput.zip
            # 如果你还想自定义 Release 正文，可以取消下面注释
            # body_path: ./CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 使用默认 token
